<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#43a047">
  <title>PetLife+ 智慧寵物生活管理系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#/home"><span class="logo">🐾</span><span>PetLife<b>+</b></span></a>
    <nav class="side-nav" id="side-nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="page-title">PetLife+</h1>
      <div class="top-actions">
        <button class="icon-btn" data-act="toggle-bell" title="通知">🔔<span class="badge" id="bell-badge" hidden></span></button>
        <button class="me-chip" data-act="switch-menu" id="me-chip"></button>
      </div>
      <div class="dropdown" id="bell-panel" hidden></div>
      <div class="dropdown" id="me-panel" hidden></div>
    </header>
    <section id="view" class="view"></section>
  </div>

  <nav class="tabbar" id="tabbar"></nav>

  <dialog id="dlg"></dialog>
  <div id="toasts" class="toasts"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
